# The chats' own tmux server: share/chat_tmux.py starts it as `tmux -S ~/.local/state/chats/tmux.sock -f <this> -u`
# (the socket CHAT_TMUX_SOCKET in a test). One session per chat, started detached; a Terminal window attached to
# one only looks at it. Each line keeps something a Terminal tab gives a chat.

# Claude Code's Ctrl+B is "background": the prefix moves off it.
set -g prefix C-]
unbind C-b
bind C-] send-prefix

# Colour, keys and focus as Claude Code's tmux notes ask (code.claude.com/docs/en/terminal-config): Shift+Enter
# needs the extended keys, its notifications the passthrough, its "away" detection the focus events.
set -g default-terminal tmux-256color
set -as terminal-features 'xterm*:extkeys:RGB'
set -g extended-keys on
set -g allow-passthrough on
set -g focus-events on
set -s escape-time 10

# tui: fullscreen captures the mouse: without `mouse on` the wheel scrolls tmux, not the chat.
set -g mouse on
set -g status off
set -g history-limit 5000
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# A detached session is 80x24 by default: the screen the app reads and the statusline's COLUMNS would shrink.
# 110 columns hold the widest full statusline line (97, 2026-11-09) plus its 4-cell margin; an attached window
# sets the size while it looks, and the window keeps it after it detaches, unless the Chats app set a fixed size
# for chats no viewer shows (chat_tmux.py FIXED: then that is the default size too).
set -g default-size 110x60
set -g window-size latest

# A server with no session stays up (the next chat reuses it); a session nobody looks at stays too.
set -s exit-empty off
set -g destroy-unattached off
set -g remain-on-exit off

# A launchd starter (pagesd) has no locale: Cyrillic in a pane needs UTF-8. PATH comes from the login shell
# each pane runs.
set -g default-shell /bin/zsh
setenv -g LANG en_US.UTF-8
setenv -g LC_CTYPE en_US.UTF-8

<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chats">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/icon.png">
<link rel="stylesheet" href="/kit/ui.css">
<link rel="stylesheet" href="/app/app.css">
<title>Chats</title>
<body>
<button type="button" id="update" hidden>Update ready · tap to reload</button>
<div id="root">
  <aside id="side">
    <header id="sidetop">
      <div id="machine" data-sheet="load" title="Load per chat"></div>
      <button type="button" class="ib" id="newbtn" data-sheet="new" data-icon="plus" title="New chat"></button>
      <div class="tools solo">
        <button type="button" class="ib" data-sheet="pages" data-icon="pages" title="Pages"></button>
        <button type="button" class="ib" data-sheet="menu" data-icon="menu" title="Menu"></button>
      </div>
    </header>
    <div id="findbox"><input id="find" class="field" type="search" placeholder="Search chats" enterkeyhint="search"
      autocomplete="off" autocorrect="off" spellcheck="false"></div>
    <div id="list"></div>
    <div class="grip" id="sidegrip" aria-hidden="true"></div>
  </aside>
  <main id="main">
    <header id="head">
      <a id="back" href="#" data-icon="back" aria-label="Chats"></a>
      <div id="title"></div>
      <div class="tools">
        <button type="button" class="ib" id="termbtn" data-sheet="term" data-icon="term" title="Terminal"></button>
        <button type="button" class="ib" id="pagesbtn" data-sheet="pages" data-icon="pages" title="Pages"></button>
        <button type="button" class="ib" data-sheet="menu" data-icon="menu" title="Menu"></button>
        <button type="button" class="ib" id="infobtn" data-sheet="info" data-icon="panel" title="Model, usage and changes"></button>
      </div>
    </header>
    <section id="chat" hidden>
      <div id="log"><div id="col"></div><div id="activity"></div></div>
      <button type="button" id="jump" data-icon="down" aria-label="To the end" hidden></button>
      <div id="dock">
        <div id="pastbar" hidden><div id="accts" hidden></div><span id="pastnote"></span>
          <button type="button" class="btn primary" id="openbtn">Open on Mac</button></div>
        <div id="opts"></div>
        <div id="suggest"></div>
        <form id="composer">
          <textarea id="input" rows="1" enterkeyhint="enter" autocomplete="off" placeholder="Message"></textarea>
          <div id="wave" hidden><canvas id="wavec"></canvas><span id="wavet"></span><span id="waveb" class="mb"></span></div>
          <div id="lost" class="mb" hidden></div>
          <div class="cbtn">
            <button type="button" id="mic" class="round" data-icon="mic" title="Dictate"></button>
            <button type="submit" id="send" class="round primary" data-icon="up" title="Send"></button>
          </div>
        </form>
      </div>
    </section>
    <section id="empty"><div>Pick a chat</div></section>
  </main>
</div>
<div id="scrim" hidden></div>
<aside id="sheet" class="sheet" hidden>
  <header><b id="sheett"></b><small id="sheets"></small><button type="button" id="sheetx" class="ib" data-icon="x" aria-label="Close"></button></header>
  <div id="sheetb"></div>
  <footer id="sheetf" hidden></footer>
  <div class="grip" id="sheetgrip" aria-hidden="true"></div>
</aside>
<div id="offline" hidden>No connection to the Mac</div>
<div id="takepill" hidden><i class="dot"></i><span id="takept"></span><button type="button" id="takex" class="ib" data-icon="x" aria-label="Stop and put the text in the box"></button></div>
<div id="overlay" hidden><button id="close" type="button" data-icon="x" aria-label="Close"></button><iframe id="frame" title="page"></iframe></div>
<div id="toast" class="toast" hidden></div>
<div id="ctxscrim" hidden></div>
<div id="ctx" class="ctx" role="menu" hidden></div>
<script type="module" src="/app/app.js"></script>

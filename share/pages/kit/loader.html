<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>…</title>
<!-- The one file served at /p/<pid>/ (share/pages/CONTRACT.md): the UI kit (/kit/ui.css: tokens and
     components, shared with the chats app), this page shell's own layout, then the page's module.
     Module styles live in the module. -->
<link rel="stylesheet" href="/kit/ui.css">
<style>
header{position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:0 .5px 0 var(--line);min-height:52px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
h1{font-size:var(--fs);font-weight:var(--fw-b);margin:0;white-space:nowrap}
#intro:empty,#cap[hidden]{display:none}
.mute,#intro{color:var(--fg2)}.num,#count,#status{font-variant-numeric:tabular-nums;white-space:nowrap}
#status{color:var(--fg3);font-size:var(--fs-m);margin-left:auto}#status.err{color:var(--red)}
#cap{color:var(--green);font-weight:var(--fw-b)}
main{padding:12px 16px 16px}
textarea{resize:vertical;min-height:calc(2lh + 14px);overflow-y:auto}
.sg::before{content:"машина: ";color:var(--fg3)}
.err{color:var(--red)}
main img{cursor:zoom-in}[data-own-zoom] img{cursor:inherit}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(12,12,14,.94);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.zpane{position:absolute;top:0;bottom:44px;overflow:hidden}.zpane+.zpane{border-left:1px solid #444}.zpane>img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;-webkit-user-drag:none}.zcap{position:absolute;left:8px;top:6px;padding:2px 7px;border-radius:var(--r-xs);background:rgba(0,0,0,.6);color:#eee;font-size:var(--fs-m);pointer-events:none}
/* the viewer is dark in either scheme: its bar takes the kit's dark text and fills */
.zbar{--fg:#fcfcfc;--fg2:#fcfcfca6;--hover:#ffffff1a;--sel:#ffffff26;--pop:#262626;--comp:#2f2f2f;--line2:#ffffff28;--link:#66b5ff;position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;gap:8px;align-items:center;padding:0 12px;background:rgba(12,12,14,.8);color:var(--fg);font-size:var(--fs-m);cursor:auto}
.zbar .mute{color:var(--fg2);margin-right:auto}.zsolo{display:flex;gap:4px}.zsolo:empty{display:none}.zpos{font-variant-numeric:tabular-nums}.zmsg{color:#f6a8f6}
.zoom.pin,.zoom.tool{cursor:crosshair}.zband{position:absolute;border:1px dashed #f0f;background:rgba(255,0,255,.08);pointer-events:none}
.att{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 8px 0}.att[hidden]{display:none}
.atw .atc{position:relative;flex:none;width:80px;height:80px}
.atw .atc img{display:block;width:100%;height:100%;min-height:0;margin:0;object-fit:cover;border-radius:var(--r-s);box-shadow:0 0 0 .5px var(--line2);background:var(--bg);cursor:zoom-in}
.atw .atc button{font:inherit;cursor:pointer}
.atw .atc .atn{position:absolute;left:4px;bottom:4px;max-width:calc(100% - 8px);overflow:hidden;font-size:var(--fs-s);line-height:16px;padding:0 4px;border:0;border-radius:var(--r-xs);background:rgba(0,0,0,.62);color:#fff}
.atw .atc .atx{position:absolute;right:4px;top:4px;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.62);opacity:0}
.atw .atx::before,.atw .atx::after{content:"";position:absolute;left:5px;top:9.25px;width:10px;height:1.5px;border-radius:1px;background:#fff;transform:rotate(45deg)}.atw .atx::after{transform:rotate(-45deg)}
.atw .atc:hover .atx,.atw .atx:focus-visible{opacity:1}.atw .atc.off img{opacity:.35}.atm{color:var(--fg3);font-size:var(--fs-m)}.atm.err{color:var(--red)}
</style></head><body>
<header><h1 id="title"></h1><span id="intro"></span><span id="count" class="count"></span><span id="cap" hidden>на сегодня хватит</span><span id="status"></span></header>
<main id="app"></main>
<script type="module">
import { start } from "/kit/shell.js";
const pid = location.pathname.split("/")[2];
// A kit error reaches the server's .events.jsonl (`page report`), at most 3 per page load.
let told = 0;
const tell = (msg, src, line) => told++ < 3 && fetch(`/p/${pid}/error`, { method: "POST", keepalive: true,
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ msg: String(msg).slice(0, 500), src: String(src || "").slice(0, 200), line: line || 0 }) }).catch(() => {});
addEventListener("error", (e) => tell(e.message, e.filename, e.lineno));
addEventListener("unhandledrejection", (e) => tell((e.reason && e.reason.stack) || e.reason, "", 0));
async function load() {
  let spec, mod;
  try {
    const r = await fetch(`/p/${pid}/spec`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    spec = await r.json();
  } catch (e) {
    document.getElementById("status").textContent = "нет связи — повторю";
    return setTimeout(load, 3000);
  }
  try {
    if (!/^[a-z][a-z0-9_-]*$/.test(spec.module || "")) throw new Error("module " + spec.module);
    mod = await import(`/kit/${spec.module}.js`);
  } catch (e) {
    tell(e.stack || e, `/kit/${spec.module}.js`, 0);
    document.getElementById("status").textContent = "модуль не загрузился — ошибка записана, повторю";
    return setTimeout(load, 3000);
  }
  start({ pid, ...spec }, mod.render);
}
load();
</script></body></html>
